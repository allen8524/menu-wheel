<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta
    name="description"
    content="메뉴를 직접 관리하고 다양한 당첨 방식으로 오늘의 식사를 추천받는 돌림판"
  />
  <title>오늘 뭐 먹지?</title>
  <meta name="theme-color" content="#f5efe0" />
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="style.css" />
  <script src="script.js" defer></script>
</head>
<body>
  <main class="app-shell">
    <section class="intro" aria-labelledby="page-title">
      <p class="eyebrow">MENU PICKER</p>
      <h1 id="page-title">오늘 뭐 먹지?</h1>
      <p class="description">메뉴를 고르기 어렵다면 돌림판에 맡겨보세요.</p>
    </section>

    <section class="wheel-panel" aria-label="메뉴 돌림판">
      <div class="wheel-stage">
        <div class="pointer" aria-hidden="true"></div>
        <canvas id="wheel" width="640" height="640" aria-label="등록된 메뉴로 구성된 추천 돌림판">
          브라우저가 캔버스를 지원하지 않습니다.
        </canvas>
        <button id="spinButton" class="spin-button" type="button">돌리기</button>
      </div>

      <div id="resultBox" class="result-box" role="status" aria-live="polite">
        <div>
          <span class="result-label">오늘의 추천 메뉴</span>
          <strong id="resultText">돌림판을 돌려보세요</strong>
        </div>
        <span id="cycleStatus" class="cycle-status" hidden></span>
      </div>

      <div class="result-actions" aria-label="추천 결과 기능">
        <button id="spinAgainButton" type="button" disabled>다시 돌리기</button>
        <button id="excludeAndSpinButton" type="button" disabled>결과 제외 후 돌리기</button>
        <button id="copyResultButton" type="button" disabled>결과 복사</button>
        <button id="mapSearchButton" type="button" disabled>지도 검색</button>
        <button id="deliverySearchButton" type="button" disabled>배달 검색</button>
      </div>
    </section>

    <aside class="menu-panel" aria-labelledby="menu-panel-title">
      <div class="panel-heading">
        <div>
          <p class="eyebrow">CUSTOMIZE</p>
          <h2 id="menu-panel-title">메뉴 관리</h2>
        </div>
        <button id="resetButton" class="text-button" type="button">기본값 복원</button>
      </div>

      <section class="control-section" aria-labelledby="draw-mode-title">
        <label id="draw-mode-title" for="drawMode">당첨 방식</label>
        <select id="drawMode">
          <option value="allow">일반 랜덤</option>
          <option value="no-consecutive">직전 결과 제외</option>
          <option value="remove-win">당첨 메뉴 자동 제거</option>
          <option value="cycle">전체 메뉴 1회씩 추천</option>
        </select>
        <p id="drawModeDescription" class="field-description"></p>
      </section>

      <section class="control-section" aria-labelledby="preset-title">
        <div class="section-heading-row">
          <h3 id="preset-title">메뉴 프리셋</h3>
          <span>선택 시 목록 교체</span>
        </div>
        <div id="presetButtons" class="preset-grid" aria-label="카테고리별 메뉴 프리셋"></div>
      </section>

      <form id="menuForm" class="menu-form">
        <label for="menuInput" class="sr-only">추가할 메뉴</label>
        <input
          id="menuInput"
          name="menu"
          type="text"
          maxlength="16"
          autocomplete="off"
          placeholder="메뉴를 입력하세요"
        />
        <button type="submit">추가</button>
      </form>

      <p id="menuMessage" class="menu-message" aria-live="polite"></p>

      <div class="menu-summary">
        <span>현재 메뉴</span>
        <strong><span id="menuCount">0</span>/16개</strong>
      </div>

      <ul id="menuList" class="menu-list" aria-label="등록된 메뉴 목록"></ul>

      <p class="hint">
        메뉴는 최소 2개가 필요합니다. 끌어서 정렬하거나 화살표 버튼으로 순서를 바꿀 수 있습니다.
      </p>
    </aside>
  </main>
</body>
</html>
